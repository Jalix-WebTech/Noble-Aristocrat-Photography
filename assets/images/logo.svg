<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Noble Aristocrat Photography logo">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3c987"/>
      <stop offset="50%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#a8842f"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>
  <!-- Camera aperture blades -->
  <g transform="translate(60,60)">
    <g fill="url(#gold)" opacity="0.92">
      <path transform="rotate(0)"   d="M0,-26 L22,-13 L18,-6 L0,-12 Z"/>
      <path transform="rotate(60)"  d="M0,-26 L22,-13 L18,-6 L0,-12 Z"/>
      <path transform="rotate(120)" d="M0,-26 L22,-13 L18,-6 L0,-12 Z"/>
      <path transform="rotate(180)" d="M0,-26 L22,-13 L18,-6 L0,-12 Z"/>
      <path transform="rotate(240)" d="M0,-26 L22,-13 L18,-6 L0,-12 Z"/>
      <path transform="rotate(300)" d="M0,-26 L22,-13 L18,-6 L0,-12 Z"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="none" stroke="url(#gold)" stroke-width="2"/>
  </g>
  <!-- Monogram letter overlay -->
  <text x="60" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="url(#gold)" text-anchor="middle">N</text>
</svg>
